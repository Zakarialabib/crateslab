[package]
name = "cratelab-shell"
description = "The cratelab desktop shell (Tauri v2): manifest-driven test UI over the lab-engine."
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Zakaria Labib"]

# STANDALONE WORKSPACE on purpose: Tauri needs the platform webview stack
# (webkit2gtk-4.1 on Linux, WebView2 on Windows) which the core workspace
# must not require. Build this directory separately:
#   cd shell/src-tauri && cargo build        (or use `npm run tauri dev`)
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

lab-engine = { path = "../../crates/lab-engine" }
lab-manifest = { path = "../../crates/lab-manifest" }
lab-mocks = { path = "../../crates/lab-mocks" }
lab-coverage = { path = "../../crates/lab-coverage" }
lab-scenarios = { path = "../../crates/lab-scenarios" }
lab-errors = { path = "../../crates/lab-errors" }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
