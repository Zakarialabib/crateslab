# cratelab forge — the authored task catalog: *what* a run asks the agent to do.
#
# Authored, not generated — the sibling of `forge.workflows.toml`, which
# describes *how* a run proceeds (the seven-stage spine). The Tauri/Svelte shell
# renders this file; the forge-core pipeline and the shell's command surface
# validate against it. Editing a task is editing this file — never a frontend.
#
# scope: pilot              — the per-crate pilot (dry runs, live previews)
#        crate-intelligence  — the internal crate-intelligence prompt path
#
# `local` is the offline half of the task; `live` is the provider half. `steps`
# is the short human-facing rail the shell renders for the selected task.

# ---------------------------------------------------------------------------
# pilot · understand
# ---------------------------------------------------------------------------
[[tasks]]
id = "research-summary"
label = "Research"
group = "Understand"
local = "Inventory source and public API"
live = "Map purpose, boundaries, related crates, and open research questions."
steps = ["Scope one crate", "Collect source evidence", "Research context", "Review claims", "Capture learning"]
scopes = ["pilot", "crate-intelligence"]

[[tasks]]
id = "feature-study"
label = "Feature study"
group = "Plan"
local = "Map API and implementation files"
live = "Trace a feature across crates, contracts, tests, and user-facing behavior."
steps = ["State feature question", "Map code path", "Trace dependencies", "Identify acceptance evidence", "Capture learning"]
scopes = ["pilot"]

[[tasks]]
id = "issue-triage"
label = "Issue triage"
group = "Plan"
local = "Prepare crate context; issue content is not fetched"
live = "Classify supplied issue text into impact, evidence, missing data, and a next action."
steps = ["Paste issue context", "Identify affected crate", "Check source evidence", "Classify impact", "Review recommendation"]
scopes = ["pilot"]

# ---------------------------------------------------------------------------
# pilot · improve
# ---------------------------------------------------------------------------
[[tasks]]
id = "rustdoc-audit"
label = "Documentation"
group = "Improve"
local = "Find public API documentation candidates"
live = "Identify missing or unclear rustdoc with exact source evidence."
steps = ["Scan public surface", "Check existing docs", "Draft doc recommendations", "Review evidence", "Capture learning"]
scopes = ["pilot", "crate-intelligence"]

# ---------------------------------------------------------------------------
# pilot · diagnose
# ---------------------------------------------------------------------------
[[tasks]]
id = "bug-investigation"
label = "Bug investigation"
group = "Diagnose"
local = "Collect risk markers and nearby API evidence"
live = "Build ranked hypotheses from supplied symptoms and source evidence; separate facts from guesses."
steps = ["Record symptom", "Map affected API", "Inspect error paths", "Rank hypotheses", "Define reproduction"]
scopes = ["pilot"]

[[tasks]]
id = "debug-plan"
label = "Debug plan"
group = "Diagnose"
local = "Collect panic, unwrap, TODO, and FIXME candidates"
live = "Propose a minimal diagnostic sequence, expected observations, and safe stop conditions."
steps = ["Record failure", "Find call path", "Select observations", "Reproduce locally", "Capture outcome"]
scopes = ["pilot"]

# ---------------------------------------------------------------------------
# pilot · learn
# ---------------------------------------------------------------------------
[[tasks]]
id = "knowledge-synthesis"
label = "Knowledge synthesis"
group = "Learn"
local = "Build source and dependency inventory"
live = "Synthesize source-grounded knowledge with provenance, confidence, and unresolved questions."
steps = ["Select evidence scope", "Retrieve source passages", "Synthesize contracts", "Check provenance", "Record reusable note"]
scopes = ["pilot"]

# ---------------------------------------------------------------------------
# pilot · research
# ---------------------------------------------------------------------------
[[tasks]]
id = "cross-language-research"
label = "Cross-language research"
group = "Research"
local = "Inventory the crate's public API, docs, tests and feature surface"
live = "Find comparable SDKs in other languages, extract what they excel at, diff against the crate, and write adoption notes (docs missing, features, issues)."
steps = ["Pick a capability", "Find comparable SDKs", "Extract the excellent parts", "Diff against the crate", "Write adoption notes", "Capture learning"]
refs = ["https://github.com/google/artemis", "https://github.com/morluto/rea"]
scopes = ["pilot"]

# ---------------------------------------------------------------------------
# crate-intelligence · verify / understand
# ---------------------------------------------------------------------------
[[tasks]]
id = "conformance-review"
label = "Conformance review"
group = "Verify"
local = "Collect input schema, generated cases, mocks and assertions"
live = "Compare input schema, generated cases, mock outcomes, and assertions; distinguish expected refusals from bugs and recommend measurable coverage improvements."
steps = ["Collect schema", "Gather generated cases", "Compare mock outcomes", "Check assertions", "Recommend coverage"]
scopes = ["crate-intelligence"]

[[tasks]]
id = "architecture-map"
label = "Architecture map"
group = "Understand"
local = "Trace direct dependencies and consumers"
live = "Trace the crate through direct dependencies and consumers; return a Mermaid dependency slice with source-backed boundary notes."
steps = ["List dependencies", "List consumers", "Map boundaries", "Draw dependency slice", "Note source-backed boundaries"]
scopes = ["crate-intelligence"]
