version: 2.1
jobs:
  rust-gates:
    docker:
      - image: cimg/rust:1.85
    steps:
      - checkout
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps
workflows:
  crate-gates:
    jobs:
      - rust-gates
